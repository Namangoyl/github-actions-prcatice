# What is the goal of your workflow
# Goal: Whenever someone changes the Python code,
# the linter will check the syntax, formatting, and indentation (Linting)
name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest

    steps:
      # This step will automatically clone the code
      - name: Check out the repository
        uses: actions/checkout@v7
       # This step will install the linting tool 
      - name: Install Ruff
        run: pip install ruff
     
